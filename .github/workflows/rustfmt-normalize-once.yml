name: One-time rustfmt normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rustfmt:
    name: Apply pinned rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.97.1 fmt --all
      - name: Commit formatting if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply rustfmt 1.97.1"
          git push origin HEAD:main
