name: One-time branch consolidation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete stale branches
    runs-on: ubuntu-latest
    steps:
      - name: Keep only main and working
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads" --jq '.[].ref' |
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            case "$branch" in
              main|working)
                echo "Keeping $branch"
                ;;
              *)
                echo "Deleting $branch"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
                ;;
            esac
          done
